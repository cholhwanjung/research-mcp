# Research Agent API — self-hosted. 사용법:
#   1) cp .env.example .env   → 값 채우기 (provider 키 + VAULT_HOST_PATH)
#   2) docker compose up --build
#   3) 프론트엔드: cd web && npm install && npm run dev   (README 참고)
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # host vault를 컨테이너 /vault로 마운트하고 그쪽을 vault 루트로 사용.
      OBSIDIAN_VAULT_PATH: /vault
      # 세션 SQLite는 named volume(Linux VM fs)에 — bind-mount 위 SQLite 락 문제 회피.
      RESEARCH_SESSIONS_DB: /data/sessions.db
      # 스냅샷·감사 로그도 vault 밖 named volume에 (에이전트 도구가 건드리지 못하게).
      RESEARCH_AGENT_STATE_DIR: /data/agent
    volumes:
      - "${VAULT_HOST_PATH:?set VAULT_HOST_PATH in .env (your Obsidian vault absolute path)}:/vault"
      - sessions:/data
    restart: unless-stopped

volumes:
  sessions:
