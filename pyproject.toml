[project]
name = "research-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "fastmcp>=3.1.1",
    "google-genai>=1.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
    "pymupdf>=1.27.2.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
